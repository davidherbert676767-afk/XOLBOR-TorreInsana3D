name: Build Torre Insana 3D APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME=/usr/lib/android-sdk
          export ANDROID_SDK_ROOT=/usr/lib/android-sdk
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/build-tools/35.0.0:$PATH"

          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare Godot settings
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mkdir -p "$HOME/.config/godot"

          cp -a /root/.local/share/godot/export_templates/4.4.1.stable \
            "$HOME/.local/share/godot/export_templates/" || true

          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          test -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"

      - name: Build Android APK
        run: |
          mkdir -p build
          godot --headless --path . \
            --export-debug "Android" \
            build/XOLBOR-TorreInsana-3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XOLBOR-TorreInsana-3D-APK
          path: build/XOLBOR-TorreInsana-3D.apk
