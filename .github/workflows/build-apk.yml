name: Build Torre Insana 3D APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Android SDK
        run: |
          export ANDROID_SDK_ROOT=/usr/lib/android-sdk
          export ANDROID_HOME=/usr/lib/android-sdk

          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

          test -d /usr/lib/android-sdk/platforms/android-35
          test -d /usr/lib/android-sdk/build-tools/35.0.0

      - name: Prepare Godot Android
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mkdir -p "$HOME/.config/godot"

          if [ -d /root/.local/share/godot/export_templates/4.4.1.stable ]; then
            cp -a /root/.local/share/godot/export_templates/4.4.1.stable \
              "$HOME/.local/share/godot/export_templates/"
          fi

          if [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot/. "$HOME/.config/godot/" || true
          fi

          test -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          test -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_release.apk"

      - name: Build Android APK
        run: |
          mkdir -p build
          godot --headless --path . \
            --export-debug "Android" \
            build/XOLBOR-TorreInsana-3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XOLBOR-TorreInsana-3D-APK
          path: build/XOLBOR-TorreInsana-3D.apk
