name: Build Torre Insana 3D

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Godot
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mkdir -p "$HOME/.config/godot"

          cp -a /root/.local/share/godot/export_templates/4.4.1.stable \
            "$HOME/.local/share/godot/export_templates/"

          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Gerar APK
        run: |
          mkdir -p build
          godot --headless --path . \
            --export-debug "Android" \
            build/XOLBOR-TorreInsana-3D.apk

      - name: Assinar APK
        run: |
          /usr/lib/android-sdk/build-tools/33.0.2/apksigner sign \
            --ks /root/debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out build/XOLBOR-TorreInsana-3D-assinado.apk \
            build/XOLBOR-TorreInsana-3D.apk

          /usr/lib/android-sdk/build-tools/33.0.2/apksigner verify \
            --verbose \
            build/XOLBOR-TorreInsana-3D-assinado.apk

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: XOLBOR-TorreInsana3D-APK
          path: build/XOLBOR-TorreInsana-3D-assinado.apk
